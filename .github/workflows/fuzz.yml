name: Fuzzing

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz (${{ matrix.alvo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - alvo: FuzzAllowed
            pacote: ./internal/filter
          - alvo: FuzzLoad
            pacote: ./internal/filter
          - alvo: FuzzParseSNI
            pacote: ./internal/proxy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Rodar ${{ matrix.alvo }} por 90 segundos
        run: go test ${{ matrix.pacote }} -run '^$' -fuzz '^${{ matrix.alvo }}$' -fuzztime 90s

      # Se o fuzzer achar uma entrada que quebra o parser, o corpus com o caso
      # mínimo é preservado para virar teste de regressão.
      - name: Guardar corpus em caso de falha
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corpus-${{ matrix.alvo }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 7